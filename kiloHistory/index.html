<script>
function getApiBase() {
  if (window.location.port === '8080') {
    return '';
  }
  return window.location.protocol + '//' + window.location.hostname + ':8080';
}
const API_BASE = getApiBase();

// 注册 log 语言到 highlight.js，基于 Kilo 插件 Shiki 的 log TextMate 语法翻译
// 来源: node_modules/@shikijs/langs/dist/log.mjs (Shiki v3.20.0)
if (typeof hljs !== 'undefined') {
  hljs.registerLanguage('log', function(hljs) {
    return {
      name: 'Log',
      contains: [
        // === 日期/时间戳 (Shiki: comment log.date) ===
        // 2026-06-12 或 2026-06-12T
        { className: 'comment', begin: /\b\d{4}-\d{2}-\d{2}(?=T|\b)/ },
        // 12:34:56.789 或 T12:34:56Z 或 T123456Z
        { className: 'comment',
          begin: /\bT?\d{1,2}:\d{2}(:\d{2}([,.]\d+)?)?(Z| ?[-+]\d{1,2}:\d{2})?\b/ },
        // T紧接数字格式: T123456.789Z
        { className: 'comment',
          begin: /\bT\d{2}\d{2}(\d{2}([,.]\d+)?)?(Z| ?[-+]\d{1,2}:\d{2})?\b/ },

        // === 错误级别 (Shiki: string.regexp, strong log.error) → 红色高亮 ===
        { className: 'keyword',
          begin: /\b(ALERT|CRITICAL|EMERGENCY|ERROR|FAILURE|FAIL|Fatal|FATAL|Error|EE)\b/ },
        { className: 'keyword', begin: /\b(error):/i },
        { className: 'keyword', begin: /\[(error|eror|err?|e|fatal|fatl|ftl|fa?)\]/i },
        // 行首单字符E标记
        { className: 'keyword', begin: /(?:^|\s)\bE\b/ },

        // === 警告级别 (Shiki: markup.deleted log.warning) ===
        { className: 'deletion',
          begin: /\b(WARNING|WARN|Warn|warn|W)\b/ },
        { className: 'deletion', begin: /\b(warning):/i },
        { className: 'deletion', begin: /\[(w(?:arning|arn|rn|n?))\]/i },
        { className: 'deletion', begin: /(?:^|\s)\bW\b/ },

        // === 信息级别 (Shiki: markup.inserted log.info) ===
        { className: 'addition',
          begin: /\b(HINT|INFO|INFORMATION|Info|NOTICE|II)\b/ },
        { className: 'addition', begin: /\b(info(?:rmation)?):/i },
        { className: 'addition', begin: /\[(i(?:nformation|nfo?|n?))\]/i },
        { className: 'addition', begin: /(?:^|\s)\bI\b/ },

        // === 调试级别 (Shiki: markup.changed log.debug) ===
        { className: 'section', begin: /\b(DEBUG|Debug|debug)\b/ },
        { className: 'section', begin: /\b(debug):/i },
        { className: 'section', begin: /\[(d(?:ebug|bug|bg|e?))\]/i },
        { className: 'section', begin: /(?:^|\s)\bD\b/ },

        // === 跟踪/详细 (Shiki: comment log.verbose) ===
        { className: 'comment', begin: /\b([Tt]race|TRACE)\b:?/ },
        { className: 'comment', begin: /\[(v(?:erbose|erb|rb|b?))\]/i },
        { className: 'comment', begin: /(?:^|\s)\bV\b/ },

        // === 双引号字符串 (Shiki: string log.string) ===
        { className: 'string', begin: /"[^"]*"/ },

        // === 单引号字符串 (Shiki: string log.string) ===
        // 前导不能是单词字符，模拟 Shiki 的 (?<!\w)
        { className: 'string', begin: /(?:^|\W)'[^']*'/ },

        // === 数字 (Shiki: constant.language log.constant) ===
        { className: 'number', begin: /\b\d+(\.\d+)?\b/ },

        // === 布尔/null (Shiki: constant.language log.constant) ===
        { className: 'literal', begin: /\b(true|false|null)\b/ },

        // === 十六进制 (Shiki: constant.language log.constant) ===
        { className: 'number', begin: /\b0x[0-9A-Fa-f]+\b/ },

        // === 十六进制哈希 40/10/7位 (Shiki: constant.language) ===
        { className: 'built_in',
          begin: /\b[0-9A-Fa-f]{40}\b|\b[0-9A-Fa-f]{10}\b|\b[0-9A-Fa-f]{7}\b/ },

        // === UUID 格式 (Shiki: constant.language log.constant) ===
        { className: 'built_in',
          begin: /\b[0-9A-Fa-f]{8}-?([0-9A-Fa-f]{4}-?){3}[0-9A-Fa-f]{12}\b/ },

        // === 异常类名 (Shiki: string.regexp, emphasis log.exceptiontype) ===
        { className: 'keyword', begin: /\b([.A-Za-z]*Exception)\b/ },

        // === 堆栈跟踪 at ... (Shiki: string.key, emphasis log.exception) ===
        { className: 'addition', begin: /^[\t ]*at[\t ]/, end: /$/ },

        // === URL (Shiki: constant.language log.constant) ===
        { className: 'link', begin: /\b[a-z]+:\/\/\S+\b\/?/ },

        // === 文件路径 (Shiki: constant.language log.constant) ===
        // 如 F:\wtoe\00.WinScripts 或 /usr/local/bin
        { className: 'built_in',
          begin: /(?<![/\\\w])([-\w]+\.)+([-\w])+(?![/\\\w])/ },
      ]
    };
  });
}

// 注册 shellscript 语言 — 基于 Shiki shellscript TextMate 语法增强
// 覆盖: Bash/Zsh/PowerShell 混合语法，弥补 highlight.js 内置 bash 对
// PowerShell cmdlet、选项、变量属性的覆盖不足
if (typeof hljs !== 'undefined') {
  hljs.registerLanguage('shellscript', function(hljs) {
    return {
      name: 'Shell Script',
      aliases: ['bash', 'sh', 'zsh', 'shell'],
      keywords: {
        $pattern: /\b[a-z][a-z0-9._-]+\b/,
        keyword: [
          'if','then','else','elif','fi','for','while','until','in','do',
          'done','case','esac','function','select','coproc','return','break',
          'continue','exit','exec','eval','source','time','nocorrect'
        ],
        literal: ['true','false'],
        built_in: [
          // Unix/Linux builtins
          'cd','pwd','ls','echo','printf','read','test','export','unset',
          'alias','unalias','type','hash','ulimit','umask','set','shift',
          'declare','typeset','local','readonly','let','jobs','fg','bg',
          'kill','disown','wait','trap','getopts',
          // PowerShell cmdlets (常用)
          'Get-Command','Get-Content','Set-Content','Out-File','Write-Host',
          'Write-Output','ForEach-Object','Where-Object','Select-Object',
          'Sort-Object','Group-Object','Measure-Object','New-Object',
          'Invoke-Command','Invoke-Expression','Invoke-WebRequest',
          'Start-Process','Stop-Process','Get-Process','Get-Service',
          'Copy-Item','Move-Item','Remove-Item','New-Item','Rename-Item',
          'Get-ChildItem','Set-Location','Push-Location','Pop-Location',
          'Test-Path','Split-Path','Join-Path','ConvertFrom-Json',
          'ConvertTo-Json','Import-Module',
          // Common CLI tools
          'node','npm','npx','bun','pnpm','yarn','git','docker','kubectl',
          'python','pip','cargo','go','java','javac','make','cmake',
          'curl','wget','ssh','scp','rsync','tar','gzip','unzip',
          'chmod','chown','sudo','su','systemctl','service','ps','top',
          'grep','awk','sed','cat','head','tail','sort','uniq','wc',
          'find','xargs','diff','patch','svn','es.exe','pwsh'
        ]
      },
      contains: [
        hljs.HASH_COMMENT_MODE,
        // === Shebang ===
        hljs.SHEBANG(),
        // === 管道和分隔符 ===
        { className: 'keyword', begin: /\|\||&&|[|&;]/ },
        // === 重定向 ===
        { className: 'keyword', begin: /[<>]{1,2}|&>/ },
        // === 选项/参数: -File, --verbose, -Encoding ===
        { className: 'attr',
          begin: /(?<=[\s|&;])(--?)[\w-]+/,
          relevance: 0
        },
        // === 变量: $VAR, $_, $? , ${VAR} ===
        {
          className: 'variable',
          begin: /\$\{/,
          end: /\}/,
          contains: ['self']
        },
        {
          className: 'variable',
          begin: /\$[_a-zA-Z][\w]*\b/,
          relevance: 10
        },
        // === 变量属性: .Property (PowerShell 特有) ===
        {
          className: 'variable',
          begin: /(?<=\$[_a-zA-Z]\w*)\.\w+/,
          relevance: 0
        },
        // === 命令替换: $(...) 和 `...` ===
        {
          className: 'subst',
          begin: /\$\(/,
          end: /\)/,
          contains: [hljs.BACKSLASH_ESCAPE]
        },
        {
          className: 'subst',
          begin: /`/,
          end: /`/,
          contains: [hljs.BACKSLASH_ESCAPE]
        },
        // === 双引号字符串 (用 keyword 色模拟 Kilo 的红色) ===
        {
          className: 'keyword',
          begin: /"/,
          end: /"/,
          contains: [
            hljs.BACKSLASH_ESCAPE,
            { className: 'variable', begin: /\$\{/, end: /\}/ },
            { className: 'variable', begin: /\$[_a-zA-Z][\w]*/ }
          ]
        },
        // === 单引号字符串 ===
        {
          className: 'string',
          begin: /'/,
          end: /'/,
          contains: [hljs.BACKSLASH_ESCAPE]
        },
        // === Heredoc ===
        {
          className: 'string',
          begin: /<<-?\s*(?=\w+)/,
          starts: { contains: [hljs.END_SAME_AS_BEGIN({
            begin: /(\w+)/,
            end: /(\w+)/,
            className: 'string'
          })]}
        },
        // === 花括号块: { ... } ===
        {
          className: 'section',
          begin: /\{/,
          end: /\}/,
          contains: ['self']
        },
        // === 括号 ===
        hljs.inherit(hljs.TITLE_MODE, {
          begin: /\(/,
          end: /\)/,
          contains: ['self']
        }),
        // === 数字 ===
        hljs.C_NUMBER_MODE,
        // === 未加引号的内容（路径、参数值等） ===
        {
          begin: /(?<=[\s|&;])([^\s|&;<>"'`(){}]+)/,
          relevance: 0
        }
      ]
    };
  });
}

let allSessions = [];
let currentSession = null;

const $list = document.getElementById('session-list');
const $count = document.getElementById('session-count');
const $body = document.getElementById('main-body');
const $header = document.getElementById('main-header');
const $title = document.getElementById('main-title');
const $dir = document.getElementById('main-dir');
const $sid = document.getElementById('main-sid');
const $search = document.getElementById('search-input');

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const diff = now - d;
  const hhmmss = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  if (diff < 86400000 && d.getDate() === now.getDate()) {
    return `今天 ${hhmmss}`;
  }
  const y = d.getFullYear();
  const m = pad(d.getMonth() + 1);
  const day = pad(d.getDate());
  if (y === now.getFullYear()) {
    return `${m}-${day} ${hhmmss}`;
  }
  return `${y}-${m}-${day} ${hhmmss}`;
}

function initIcon(title) {
  if (!title) return 'K';
  const ch = title.trim().charAt(0);
  if (/[\u4e00-\u9fff]/.test(ch)) return ch;
  return ch.toUpperCase();
}

function renderSessionList(sessions) {
  if (sessions.length === 0) {
    $list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">暂无会话</div>';
    $count.textContent = '0 个会话';
    return;
  }
  $count.textContent = sessions.length + ' 个会话';
  $list.innerHTML = sessions.map(s => {
    const active = currentSession && currentSession.id === s.id ? ' active' : '';
    const sub = s.parent_id ? ' sub-session' : '';
    return `<div class="session-item${active}${sub}" data-id="${s.id}" data-parent="${s.parent_id || ''}" onclick="selectSession('${s.id}')">
      <div class="session-item-icon">${initIcon(s.title)}</div>
      <div class="session-item-content">
        <div class="session-item-title">${escHtml(s.title || '未命名会话')}</div>
        <div class="session-item-meta">
          <span>${escHtml(s.directory || '')}</span>
        </div>
      </div>
      <div class="session-item-time">${fmtTime(s.updated)}</div>
    </div>`;
  }).join('');
}

function filterSessions() {
  const q = $search.value.toLowerCase().trim();
  if (!q) { renderSessionList(allSessions); return; }
  const filtered = allSessions.filter(s =>
    (s.title || '').toLowerCase().includes(q) ||
    (s.directory || '').toLowerCase().includes(q) ||
    (s.id || '').toLowerCase().includes(q)
  );
  renderSessionList(filtered);
}

function escHtml(s) {
  if (s == null) return '';
  s = String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  if (s == null) return '';
  s = String(s);
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function copyText(btn, text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  } catch {
    btn.textContent = '失败';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  }
}

function simpleMd(text) {
  if (typeof marked !== 'undefined') {
    marked.setOptions({ breaks: true, gfm: true });
    marked.use({
      renderer: {
        html(token) {
          return escHtml(token.text);
        }
      }
    });
    return marked.parse(text);
  }
  return escHtml(text).replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
}

function enhanceCodeBlocks(container) {
  const pres = container.querySelectorAll('.text-part pre, .reasoning-body pre');
  for (const pre of pres) {
    if (pre.parentElement.classList.contains('code-block-wrapper')) continue;
    const code = pre.querySelector('code');
    const text = code ? code.textContent : pre.textContent;
    let lang = '';
    if (code && code.className) {
      const m = code.className.match(/language-(\w+)/);
      if (m) lang = m[1];
    }
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block-wrapper';
    const header = document.createElement('div');
    header.className = 'code-block-header';
    header.innerHTML = '<span class="lang-label">' + escHtml(lang || 'code') + '</span>';
    const btn = document.createElement('span');
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    btn.onclick = function(e) { e.stopPropagation(); copyText(btn, text); };
    header.appendChild(btn);
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);
    pre.style.margin = '0';
    pre.style.border = 'none';
    pre.style.borderRadius = '0';
    if (window.hljs) {
      const codeEl = pre.querySelector('code');
      if (codeEl) hljs.highlightElement(codeEl);
    }
  }
  // 对 bash 命令和输出块应用语法高亮（模拟 Kilo 插件的 shellscript/log 高亮）
  if (window.hljs) {
    const bashBlocks = container.querySelectorAll('.bash-cmd-block code.language-shellscript, .bash-out-block code.language-json, .bash-out-block code.language-log');
    for (const codeEl of bashBlocks) {
      if (!codeEl.dataset.highlighted) {
        hljs.highlightElement(codeEl);
      }
    }
  }
}

function toolIcon(type) {
  if (type === 'bash') return '&gt;_';
  if (type === 'write' || type === 'edit' || type === 'apply_patch') return '✎';
  if (type === 'read' || type === 'list') return '📖';
  if (type === 'glob' || type === 'grep') return '🔍';
  if (type === 'question') return '?';
  if (type === 'task') return '⚡';
  if (type === 'skill') return '🔧';
  if (type === 'webfetch') return '🌐';
  if (type === 'websearch') return '🔎';
  return '◆';
}

function toolCss(type) {
  if (type === 'bash') return 'bash';
  if (type === 'write' || type === 'edit') return 'write';
  if (type === 'read' || type === 'glob' || type === 'grep') return 'read';
  if (type === 'question') return 'question';
  if (type === 'task') return 'other';
  if (type === 'skill') return 'bash';
  if (type === 'webfetch') return 'webfetch';
  if (type === 'websearch') return 'webfetch';
  return 'other';
}

function toolTitle(part) {
  const t = part.tool || '';
  if (t === 'question') {
    const n = (part.questions || []).length;
    return n === 1 ? '问题 1 已回答' : '问题 ' + n + ' 已回答';
  }
  if (t === 'write' || t === 'edit') {
    const label = t === 'write' ? '写入文件 ' : '编辑文件 ';
    return label + (part.filePath || '');
  }
  if (t === 'bash') return '执行命令';
  if (t === 'read') {
    const isDirectory = (part.output || '').includes('<type>directory</type>') || (part.output || '').includes('<entries>');
    return (isDirectory ? '列出目录 ' : '读取文件 ') + (part.filePath || '');
  }
  if (t === 'glob') return '搜索文件';
  if (t === 'grep') return '搜索内容';
  if (t === 'list') return '列出目录';
  if (t === 'task') return 'Explore 智能体';
  if (t === 'skill') return '读取技能';
  if (t === 'invalid') return '无效工具调用';
  if (t === 'todowrite' || t === 'todoread') return '待办事项';
  if (t === 'webfetch') return '获取网页';
  if (t === 'websearch') return '搜索 ' + (part.query || '');
  return t || '工具调用';
}

function toolTitleHtml(part) {
  let diff = '';
  if (part.additions != null) {
    diff += ' <span style="color:var(--green)">+' + part.additions + '</span>';
  }
  if (part.deletions != null) {
    diff += ' <span style="color:var(--red)">-' + part.deletions + '</span>';
  }
  return diff;
}

function toolSubHtml(part) {
  if (part.tool === 'read') {
    const parts = [];
    if (part.offset != null) parts.push('offset=<span class="tool-param-num">' + escHtml(part.offset) + '</span>');
    if (part.limit != null) parts.push('limit=<span class="tool-param-num">' + escHtml(part.limit) + '</span>');
    return parts.join(' ');
  }
  return escHtml(toolSub(part));
}

function toolSub(part) {
  if (part.tool === 'skill') {
    const parts = [];
    if (part.skillName) parts.push('[' + part.skillName + ']');
    if (part.description) parts.push(part.description);
    return parts.join(' · ');
  }
  if (part.tool === 'invalid') {
    const msg = part.output || '';
    return msg.length > 80 ? msg.substring(0, 80) + '...' : msg;
  }
  const workdirInfo = part.workdir ? ' · workdir: ' + part.workdir : '';
  if (part.description) return part.description + workdirInfo;
  if (part.command) return part.command + workdirInfo;
  if (part.tool === 'read') {
    const parts = [];
    if (part.offset != null) parts.push('offset=' + part.offset);
    if (part.limit != null) parts.push('limit=' + part.limit);
    return parts.join(' ');
  }
  if (part.tool === 'glob') {
    const parts = [];
    if (part.path) parts.push('搜索路径 ' + part.path);
    else if (part.filePath) parts.push('搜索路径 ' + part.filePath);
    if (part.pattern) parts.push('pattern=' + part.pattern);
    return parts.join(' ');
  }
  if (part.tool === 'grep') {
    const parts = [];
    if (part.path) parts.push('搜索路径 ' + part.path);
    else if (part.filePath) parts.push('搜索路径 ' + part.filePath);
    if (part.pattern) parts.push('搜索内容 ' + part.pattern);
    if (part.include) parts.push('include=' + part.include);
    return parts.join(' ');
  }
  if (part.tool === 'task') {
    const parts = [];
    if (part.subagentType) parts.push('类型: ' + part.subagentType);
    if (part.taskId) parts.push('ID: ' + part.taskId);
    return parts.join(' · ');
  }
  if (part.filePath) return part.filePath;
  if (part.tool === 'webfetch') return part.url || '';
  if (part.tool === 'websearch') return part.query || '';
  return '';
}

function toolBody(part) {
    // 先清理输出：剥离 ANSI 转义码，处理回车符
    var cleanOutput = processCarriageReturns(stripAnsi(part.output || ''));
    let html = '';
    if (part.tool === 'question') {
        html += '<div class="question-body">';
        const qs = part.questions || [];
        const as = part.answers || [];
        for (let i = 0; i < qs.length; i++) {
            const q = qs[i];
            const ans = as[i] || [];
            const options = q.options || [];
            const answerSet = new Set(ans);
            html += '<div class="question-item">';
            if (q.header) {
                html += '<div class="question-header-text">' + escHtml(q.header) + '</div>';
            }
            html += '<div class="question-text">' + escHtml(q.question || q.header || '') + '</div>';
            if (options.length > 0) {
                html += '<div class="question-options">';
                for (const opt of options) {
                    const picked = answerSet.has(opt.label);
                    html += `<div class="question-option${picked ? ' picked' : ''}">
                        <span class="question-option-box">${picked ? '✓' : ''}</span>
                        <span class="question-option-main">
                            <span class="option-label">${escHtml(opt.label || '')}</span>
                            ${opt.description ? `<span class="option-description">${escHtml(opt.description)}</span>` : ''}
                        </span>
                    </div>`;
                }
                html += '</div>';
            } else if (ans.length > 0) {
                html += '<div class="answer-text">' + escHtml(ans.join(', ')) + '</div>';
            }
            html += '</div>';
        }
        html += '</div>';
    }
    if (part.tool === 'task' && part.taskId) {
        html += `<div class="task-link" onclick="event.stopPropagation();selectSession('${escAttr(part.taskId)}')">
            <span class="task-link-icon">↗</span>
            <span class="task-link-text">
                <div class="task-link-label">查看子会话</div>
                <div class="task-link-id">${escHtml(part.taskId)}</div>
            </span>
        </div>`;
    }
    if (part.toolInput && !part.command && part.tool !== 'question') {
        html += `<div class="bash-section">
            <div class="bash-section-label">输入<span class="copy-btn" data-copy="${escAttr(part.toolInput)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
            <pre class="bash-out-block"><code class="language-json">${escHtml(part.toolInput)}</code></pre>
        </div>`;
    }
    if (part.command) {
        html += `<div class="bash-section">`;
        if (part.workdir) {
            html += `<div class="bash-section-label">工作目录</div>
            <pre class="bash-cmd-block"><code class="language-shellscript">${escHtml(part.workdir)}</code></pre>
            <div class="bash-separator"></div>`;
        }
        html += `<div class="bash-section-label">命令<span class="copy-btn" data-copy="${escAttr(part.command)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
            <pre class="bash-cmd-block"><code class="language-shellscript">${escHtml(part.command)}</code></pre>`;
        if (part.output != null) {
            html += `<div class="bash-separator"></div>
                <div class="bash-section-label">输出<span class="copy-btn" data-copy="${escAttr(cleanOutput)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
                <pre class="bash-out-block"><code class="language-log">${escHtml(cleanOutput) || '(无输出)'}</code></pre>`;
        }
        html += `</div>`;
    } else if (part.output) {
        if (part.tool === 'question') {
            html += `<div class="bash-section">
                <div class="bash-section-label">输出<span class="copy-btn" data-copy="${escAttr(cleanOutput)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
                ${renderQuestionOutput(part, cleanOutput)}
            </div>`;
        } else if (part.tool === 'read' && part.output && part.output.includes('<path>')) {
            if (part.output.includes('<content>')) {
                html += renderReadOutput(cleanOutput);
            } else if (part.output.includes('<entries>')) {
                html += renderReadDirectoryOutput(cleanOutput);
            } else {
                html += `<div class="bash-section">
                <div class="bash-section-label">输出<span class="copy-btn" data-copy="${escAttr(cleanOutput)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
                <pre class="bash-out-block"><code class="language-log">${escHtml(cleanOutput)}</code></pre>
            </div>`;
            }
        } else {
            html += `<div class="bash-section">
                <div class="bash-section-label">输出<span class="copy-btn" data-copy="${escAttr(cleanOutput)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
                <pre class="bash-out-block"><code class="language-log">${escHtml(cleanOutput)}</code></pre>
            </div>`;
        }
    }
    if (part.diff) {
        html += `<div class="diff-view">${renderDiff(part.diff)}</div>`;
    } else if (part.content) {
        html += `<div class="content-block-wrapper">
            <div class="content-block-header">
                <span class="content-label">内容</span>
                <span class="copy-btn" data-copy="${escAttr(part.content)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span>
            </div>
            <div class="content-block">`;
        const lines = part.content.split('\n');
        for (const l of lines) {
            html += `<div class="line"><span>${escHtml(l)}</span></div>`;
        }
        html += `</div></div>`;
    }
    // 显示错误/中止信息
    if (part.status === 'error' || part.error || part.reason) {
        let errorMsg = 'Tool execution aborted';
        if (part.error) errorMsg = part.error;
        if (part.reason) errorMsg = part.reason;
        html += `<div class="tool-error">${escHtml(errorMsg)}</div>`;
    }
    if (!part.command && !part.output && !part.content && !part.diff && !part.toolInput && part.tool !== 'question' && !part.error && !part.reason) {
        html += `<div style="padding:8px 12px;color:var(--text-muted)">(无详细内容)</div>`;
    }
    return html;
}

// 渲染 question 工具的输出
function renderQuestionOutput(part, output) {
    const qs = part.questions || [];
    const as = part.answers || [];
    if (qs.length === 0) {
        return `<pre class="bash-out-block"><code class="language-log">${escHtml(output)}</code></pre>`;
    }
    let html = '<div class="question-output-body">';
    for (let i = 0; i < qs.length; i++) {
        const q = qs[i];
        const ans = as[i] || [];
        html += '<div class="question-output-item">';
        html += '<div class="question-row"><span class="question-label">问题：</span><span class="question-value">' + escHtml(q.question || q.header || '') + '</span></div>';
        html += '<div class="question-row"><span class="question-label">用户回答：</span><span class="question-value answer-text">' + escHtml(ans.join(', ') || '未回答') + '</span></div>';
        html += '</div>';
    }
    html += '</div>';
    return html;
}

// 渲染 read 工具的输出
function renderReadOutput(output) {
    let html = '';
    const lines = output.split('\n');
    let inContent = false;
    let filePath = '';
    let fileType = '';
    let contentLines = [];
    let footerLines = [];
    
    // 先解析内容
    for (const line of lines) {
        if (line.startsWith('<path>') && line.endsWith('</path>')) {
            filePath = line.slice(6, -7);
        } else if (line.startsWith('<type>') && line.endsWith('</type>')) {
            fileType = line.slice(6, -7);
        } else if (line === '<content>') {
            inContent = true;
        } else if (line.startsWith('(End of file') || line.startsWith('(Showing lines')) {
            footerLines.push(line);
            inContent = false;
        } else if (line === '</content>' && footerLines.length > 0) {
            footerLines.push(line);
        } else if (inContent) {
            contentLines.push(line);
        }
    }
    
    // 构建纯内容用于复制（不带行号）
    let pureContent = '';
    for (const line of contentLines) {
        const match = line.match(/^(\d+):\s?(.*)$/);
        if (match) {
            pureContent += match[2] + '\n';
        } else {
            pureContent += line + '\n';
        }
    }
    pureContent = pureContent.trim();
    
    // 构建HTML
    html += `<div class="read-output-view">`;
    html += `<div class="read-output-header">`;
    if (filePath) {
        html += `<span class="read-path">${escHtml(filePath)}</span>`;
    }
    html += `<span class="copy-btn" data-copy="${escAttr(pureContent)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制纯内容</span>`;
    html += `</div>`;
    html += `<div class="read-output-content">`;
    
    for (const line of contentLines) {
        const match = line.match(/^(\d+):\s?(.*)$/);
        if (match) {
            const lineNum = match[1];
            const lineContent = match[2];
            html += `<div class="read-line">
                <span class="read-line-num">${lineNum}</span>
                <span class="read-line-text">${escHtml(lineContent)}</span>
            </div>`;
        } else {
            html += `<div class="read-line">
                <span class="read-line-num"></span>
                <span class="read-line-text">${escHtml(line)}</span>
            </div>`;
        }
    }
    
    html += `</div></div>`;
    
    if (footerLines.length > 0) {
        html += `<div class="read-end-line">${footerLines.map(escHtml).join('<br>')}</div>`;
    }
    
    return html;
}

function renderReadDirectoryOutput(output) {
    let html = '';
    const lines = output.split('\n');
    let filePath = '';
    let fileType = '';
    let entries = [];
    let inEntries = false;
    let entryCount = 0;

    for (const line of lines) {
        if (line.startsWith('<path>') && line.endsWith('</path>')) {
            filePath = line.slice(6, -7);
        } else if (line.startsWith('<type>') && line.endsWith('</type>')) {
            fileType = line.slice(6, -7);
        } else if (line === '<entries>') {
            inEntries = true;
        } else if (line === '</entries>') {
            inEntries = false;
        } else if (line.startsWith('(') && line.endsWith(' entries)')) {
            const m = line.match(/\((\d+) entries\)/);
            if (m) entryCount = parseInt(m[1]);
        } else if (inEntries) {
            const trimmed = line.trim();
            if (trimmed) {
                const isDir = trimmed.endsWith('/');
                const name = isDir ? trimmed.slice(0, -1) : trimmed;
                entries.push({ name, isDir });
            }
        }
    }

    html += `<div class="read-output-view">`;
    html += `<div class="read-output-header">`;
    if (filePath) {
        html += `<span class="read-path">${escHtml(filePath)}</span>`;
    }
    if (fileType) {
        html += `<span class="read-type">${escHtml(fileType)}</span>`;
    }
    if (entryCount > 0) {
        html += `<span class="read-entry-count">${entryCount} 个条目</span>`;
    }
    html += `</div>`;
    html += `<div class="read-output-content">`;

    for (const entry of entries) {
        const icon = entry.isDir ? '📁' : '📄';
        html += `<div class="read-dir-entry">
            <span class="read-dir-icon">${icon}</span>
            <span class="read-dir-name">${escHtml(entry.name)}</span>
            ${entry.isDir ? '<span class="read-dir-slash">/</span>' : ''}
        </div>`;
    }

    html += `</div></div>`;
    return html;
}

function renderDiff(diff) {
  if (!diff) return '';
  let html = `<div class="diff-header">
    <span>Diff 预览</span>
    <button class="copy-btn" data-copy="${escAttr(diff)}" onclick="event.stopPropagation();copyDiff(this, this.getAttribute('data-copy'))">复制纯内容</button>
  </div>`;
  const lines = diff.split('\n');
  let oldNum = 0;
  let newNum = 0;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith('@@')) {
      const m = l.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (m) { oldNum = parseInt(m[1]) - 1; newNum = parseInt(m[2]) - 1; }
      html += `<div class="diff-hunk">${escHtml(l)}</div>`;
    } else if (l.startsWith('+') && !l.startsWith('+++')) {
      newNum++;
      html += `<div class="diff-line diff-add">
        <span class="diff-num">${newNum}</span>
        <span class="diff-sign">+</span>
        <span class="diff-text">${escHtml(l.substring(1))}</span>
      </div>`;
    } else if (l.startsWith('-') && !l.startsWith('---')) {
      oldNum++;
      html += `<div class="diff-line diff-del">
        <span class="diff-num">${oldNum}</span>
        <span class="diff-sign">-</span>
        <span class="diff-text">${escHtml(l.substring(1))}</span>
      </div>`;
    } else if (l.startsWith('---') || l.startsWith('+++') || l.startsWith('Index:') || l.startsWith('===')) {
      continue;
    } else {
      oldNum++; newNum++;
      html += `<div class="diff-line">
        <span class="diff-num">${newNum}</span>
        <span class="diff-sign"> </span>
        <span class="diff-text">${escHtml(l)}</span>
      </div>`;
    }
  }
  return html;
}

function copyDiff(btn, diff) {
  let content = '';
  const lines = diff.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith('@@') || 
        l.startsWith('---') || 
        l.startsWith('+++') || 
        l.startsWith('Index:') || 
        l.startsWith('===')) {
      continue;
    }
    if (l.startsWith('+')) {
      content += l.substring(1) + '\n';
    } else if (!l.startsWith('-')) {
      content += l + '\n';
    }
  }
  copyText(btn, content.trim());
}

// 剥离 ANSI 转义码，与 Kilo 插件行为一致
function stripAnsi(text) {
  if (!text) return '';
  return text.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');
}

// 处理回车符（\r），Windows CLI 工具用 \r 做进度条覆盖
// 与 Kilo 插件的 processCarriageReturns 行为一致
function processCarriageReturns(input) {
  if (!input) return '';
  // 先将 \r\n 标准化为 \n
  var normalized = input.replace(/\r\n/g, '\n');
  return normalized
    .split('\n')
    .map(function(line) {
      if (line.indexOf('\r') === -1) return line;
      var parts = line.split('\r');
      // 末尾 \r 产生空段 — 保留上一个可见帧
      var last = parts[parts.length - 1];
      if (last !== '') return last;
      for (var i = parts.length - 2; i >= 0; i--) {
        if (parts[i] !== '') return parts[i];
      }
      return '';
    })
    .join('\n');
}

function formatTokens(tokens) {
  if (!tokens) return '';
  const t = tokens;
  const parts = [];
  if (t.input) parts.push('输入 ' + t.input);
  if (t.output) parts.push('输出 ' + t.output);
  return parts.join(' · ');
}

function renderImagePart(part) {
  const url = part.url || '';
  if (!url || !(part.mime || '').startsWith('image/')) return '';
  const filename = part.filename || 'image';
  return `<div class="image-part">
    <img src="${escAttr(url)}" alt="${escAttr(filename)}" title="${escAttr(filename)}" loading="lazy" onclick="openImageModal(this.src, '${escAttr(filename)}')">
    <div class="image-caption">${escHtml(filename)}</div>
  </div>`;
}

function renderUserParts(parts) {
  if (!parts || parts.length === 0) return { imageHtml: '', textHtml: '' };
  let imageHtml = '';
  let textHtml = '';
  for (const p of parts) {
    if (p.type === 'text') {
      textHtml += `<div class="user-text-part">${escHtml(p.text || '')}</div>`;
    } else if (p.type === 'file') {
      imageHtml += renderImagePart(p);
    }
  }
  return { imageHtml, textHtml };
}

function renderParts(parts) {
  if (!parts || parts.length === 0) return { html: '', tokensInfo: '' };
  let html = '<div class="assistant-parts">';
  let tokensInfo = '';
  for (const p of parts) {
    switch (p.type) {
      case 'reasoning':
        html += `<div class="reasoning-part">
          <div class="reasoning-header" onclick="togglePart(this.parentElement)">
            <span class="icon">🧠</span>
            <span class="label">推理</span>
            <span class="summary">${escHtml((p.text || '').substring(0, 80))}</span>
            <span class="t-expand">▶</span>
          </div>
          <div class="reasoning-body">${simpleMd(p.text || '')}</div>
          <div class="part-meta">${fmtTime(p.time_created)}</div>
        </div>`;
        break;
      case 'text':
        html += `<div class="text-part">
          ${simpleMd(p.text || '')}
          <div class="part-meta">${fmtTime(p.time_created)}</div>
        </div>`;
        break;
      case 'file':
        html += renderImagePart(p);
        break;
      case 'tool':
        if (p.tool === 'todowrite') {
          html += `<div class="todo-part open">
            <div class="todo-header" onclick="togglePart(this.parentElement)">
              <span class="t-icon">✓</span>
              <span class="t-summary">
                <div class="t-title">待办事项</div>
                ${renderTodoSub(p) ? '<div class="t-sub">' + escHtml(renderTodoSub(p)) + '</div>' : ''}
              </span>
              <span class="t-expand">▶</span>
            </div>
            ${renderTodoBody(p)}
            <div class="part-meta">${fmtTime(p.time_created)}</div>
          </div>`;
        } else {
          const isError = p.status === 'error' || p.error || p.reason || p.tool === 'invalid';
          const isModify = p.tool === 'write' || p.tool === 'edit';
          const isTask = p.tool === 'task';
          html += `<div class="tool-part${isError ? ' error' : ''}${isModify ? ' modify' : ''}${isTask ? ' task' : ''}">
            <div class="tool-header" onclick="togglePart(this.parentElement)">
              <span class="t-icon ${toolCss(p.tool)}">${toolIcon(p.tool)}</span>
              <span class="t-summary">
                <div class="t-title">${escHtml(toolTitle(p))}${toolTitleHtml(p)}</div>
                ${toolSub(p) ? '<div class="t-sub">' + toolSubHtml(p) + '</div>' : ''}
              </span>
              <span class="t-expand">▶</span>
            </div>
            <div class="tool-body">${toolBody(p)}</div>
            <div class="part-meta">${fmtTime(p.time_created)}</div>
          </div>`;
        }
        break;
      case 'step-start':
        break;
      case 'step-finish':
        if (p.tokens) {
          tokensInfo = formatTokens(p.tokens);
        }
        break;
      case 'compaction':
        html += `<div style="padding:8px;color:var(--text-muted);font-size:12px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);margin:8px 0;">[对话压缩]
          <div class="part-meta" style="text-align:center">${fmtTime(p.time_created)}</div>
        </div>`;
        break;
    }
  }
  html += '</div>';
  return { html, tokensInfo };
}

function renderTodoBody(part) {
  const todos = part.todos || [];
  if (todos.length === 0) {
    return '<div style="padding:8px 12px;color:var(--text-muted)">(无待办事项)</div>';
  }
  let html = '<div class="todo-body">';
  for (const todo of todos) {
    const completed = todo.status === 'completed';
    html += `<div class="todo-item${completed ? ' completed' : ''}">
      <div class="todo-checkbox">
        <span class="todo-checkmark">✓</span>
      </div>
      <div class="todo-text">${escHtml(todo.content || '')}</div>
    </div>`;
  }
  html += '</div>';
  return html;
}

function renderTodoSub(part) {
  const todos = part.todos || [];
  if (todos.length === 0) return '';
  const completed = todos.filter(t => t.status === 'completed').length;
  return `${completed}/${todos.length} 完成`;
}

function renderMessages(msgs) {
  if (!msgs || msgs.length === 0) {
    return '<div class="empty-state"><p>该会话无消息记录</p></div>'
  }
  let html = ''
  // 先把消息按 parentID 分组，这样可以知道哪些 assistant 消息属于同一个 user 消息
  // 简单起见，先检查每个 assistant 消息有没有 error 是 MessageAbortedError
  for (const m of msgs) {
    if (m.role === 'user') {
      const parts = m.parts || []
      const { imageHtml, textHtml } = renderUserParts(parts)
      // 构建元信息（统一使用 · 连接格式）
      let userMetaParts = []
      if (m.agent) userMetaParts.push(m.agent)
      if (m.model) userMetaParts.push(m.model)
      userMetaParts.push(fmtTime(m.time_created))
      userMetaParts = userMetaParts.filter(p => p)
      html += `<div class="turn">
${imageHtml ? `<div class="user-file-msg"><div class="user-file-msg-wrapper">${imageHtml}</div></div>` : ''}
${textHtml ? `<div class="user-msg">
  <div class="user-msg-wrapper">
    <div class="user-msg-header" onclick="toggleUserMsgFromHeader(this)">
      <span>用户</span>
      <span class="user-msg-header-toggle">展开全部</span>
    </div>
    <div class="user-msg-bubble">
      <div class="user-msg-body">${textHtml}</div>
      <div class="user-msg-toggle" onclick="toggleUserMsg(this)">展开全部</div>
    </div>
  </div>
</div>` : ''}
        <div class="user-msg-meta" style="justify-content:flex-end">
          <span>${userMetaParts.join(' · ')}</span>
        </div>
      </div>`
    } else if (m.role === 'assistant') {
      // 先渲染 parts
      const { html: partsHtml, tokensInfo } = renderParts(m.parts)
      html += `<div class="turn">
        ${partsHtml}`
      // 检查是否有中断错误
      if (m.error && m.error.name === 'MessageAbortedError') {
        html += `<div class="interrupted-divider">
          <span class="interrupted-icon">⊘</span>
          <span>Tool execution aborted</span>
        </div>`
      }
      // 构建元信息
      let metaParts = []
      if (m.agent) metaParts.push(m.agent)
      if (m.model) metaParts.push(m.model)
      if (tokensInfo) metaParts.push(`Token: ${tokensInfo}`)
      metaParts.push(fmtTime(m.time_created))
      // 过滤掉空值
      metaParts = metaParts.filter(p => p)
      html += `<div class="user-msg-meta" style="justify-content:flex-start">
          <span>${metaParts.join(' · ')}</span>
        </div>
      </div>`
    }
  }
  return html
}

function togglePart(el) {
  el.classList.toggle('open');
}

function toggleUserMsg(el) {
  const bubble = el.parentElement;
  bubble.classList.toggle('expanded');
  el.textContent = bubble.classList.contains('expanded') ? '收起' : '展开全部';
  // 同步 header 上的 toggle 文字
  const wrapper = bubble.parentElement;
  const headerToggle = wrapper.querySelector('.user-msg-header-toggle');
  if (headerToggle) headerToggle.textContent = el.textContent;
}

function toggleUserMsgFromHeader(el) {
  const wrapper = el.parentElement;
  const bubble = wrapper.querySelector('.user-msg-bubble');
  bubble.classList.toggle('expanded');
  const text = bubble.classList.contains('expanded') ? '收起' : '展开全部';
  el.querySelector('.user-msg-header-toggle').textContent = text;
  // 同步行内 toggle 文字
  const inlineToggle = bubble.querySelector('.user-msg-toggle');
  if (inlineToggle) inlineToggle.textContent = text;
}

function checkUserMsgOverflow(container) {
  container.querySelectorAll('.user-msg-body').forEach(el => {
    if (el.scrollHeight > el.clientHeight) {
      el.classList.add('clamped');
      // 内容超长时显示 header 栏
      const bubble = el.parentElement;
      const wrapper = bubble.parentElement;
      const header = wrapper.querySelector('.user-msg-header');
      if (header) header.classList.add('visible');
    }
  });
}

function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  sidebar.classList.toggle('collapsed');
}

async function loadSessions() {
  try {
    const res = await fetch(API_BASE + '/api/sessions');
    allSessions = await res.json();
    renderSessionList(allSessions);
  } catch (err) {
    $list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--red)">加载失败: ' + escHtml(err.message) + '</div>';
    $count.textContent = '加载失败';
  }
}

async function selectSession(id) {
  currentSession = allSessions.find(s => s.id === id);
  if (!currentSession) return;

  $header.style.display = 'flex';
  $title.textContent = currentSession.title || '未命名会话';
  $dir.textContent = currentSession.directory || '';
  $sid.innerHTML = escHtml(currentSession.id || '') + ' <a class="sid-link" href="' + escAttr(API_BASE + '/api/sessions/' + encodeURIComponent(currentSession.id) + '/messages') + '" target="_blank" title="在新窗口打开 API">↗</a>';

  const $parentContainer = document.getElementById('parent-link-container');
  if (currentSession.parent_id) {
    const parentSession = allSessions.find(s => s.id === currentSession.parent_id);
    const parentTitle = parentSession ? escHtml(parentSession.title || '未命名会话') : currentSession.parent_id;
    $parentContainer.innerHTML = `<div class="parent-link" onclick="selectSession('${escAttr(currentSession.parent_id)}')">
      <span class="parent-link-icon">↩</span>
      <span>返回父会话: ${parentTitle}</span>
    </div>`;
  } else {
    $parentContainer.innerHTML = '';
  }

  $body.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px">加载会话内容...</p></div>';

  filterSessions();

  try {
    const res = await fetch(API_BASE + '/api/sessions/' + encodeURIComponent(id) + '/messages');
    const msgs = await res.json();
    $body.innerHTML = renderMessages(msgs);
    enhanceCodeBlocks($body);
    checkUserMsgOverflow($body);
  } catch (err) {
    $body.innerHTML = '<div class="empty-state"><p style="color:var(--red)">加载失败: ' + escHtml(err.message) + '</p></div>';
  }
}

loadSessions();

function openImageModal(src, filename) {
  const modal = document.getElementById('image-modal');
  const img = modal.querySelector('img');
  const caption = modal.querySelector('.image-modal-caption');
  img.src = src;
  caption.textContent = filename;
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

document.addEventListener('click', function(e) {
  const modal = document.getElementById('image-modal');
  if (e.target === modal) {
    modal.style.display = 'none';
    document.body.style.overflow = '';
  }
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const modal = document.getElementById('image-modal');
    if (modal.style.display === 'flex') {
      modal.style.display = 'none';
      document.body.style.overflow = '';
    }
  }
});
</script>

<div id="image-modal" class="image-modal" style="display:none">
  <span class="image-modal-close" onclick="document.getElementById('image-modal').style.display='none'; document.body.style.overflow=''">&times;</span>
  <img class="image-modal-content" src="" alt="">
  <div class="image-modal-caption"></div>
</div>

</body>
</html>
