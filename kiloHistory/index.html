<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilo 对话历史</title>
<script src="marked.umd.js"></script>
<link rel="stylesheet" href="github.min.css">
<script src="highlight.min.js"></script>
<link rel="stylesheet" href="kiloIndex.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-header-content">
      <h1>Kilo 对话历史</h1>
      <div class="count" id="session-count">加载中...</div>
    </div>
    <div class="sidebar-toggle" onclick="toggleSidebar()">
      <span class="toggle-icon">◀</span>
    </div>
  </div>
  <div class="sidebar-search">
    <input type="text" id="search-input" placeholder="搜索会话..." oninput="filterSessions()">
  </div>
  <div class="session-list" id="session-list"></div>
</aside>

<main class="main">
  <div class="main-header" id="main-header" style="display:none">
    <div>
      <h2 id="main-title"></h2>
      <span class="dir" id="main-dir"></span>
      <div class="sid" id="main-sid"></div>
      <div id="parent-link-container"></div>
    </div>
  </div>
  <div class="main-body" id="main-body">
    <div class="empty-state">
      <div class="icon">💬</div>
      <p>选择左侧会话查看对话历史</p>
    </div>
  </div>
</main>

<script>
function getApiBase() {
  if (window.location.port === '8080') {
    return '';
  }
  return window.location.protocol + '//' + window.location.hostname + ':8080';
}
const API_BASE = getApiBase();

let allSessions = [];
let currentSession = null;

const $list = document.getElementById('session-list');
const $count = document.getElementById('session-count');
const $body = document.getElementById('main-body');
const $header = document.getElementById('main-header');
const $title = document.getElementById('main-title');
const $dir = document.getElementById('main-dir');
const $sid = document.getElementById('main-sid');
const $search = document.getElementById('search-input');

function fmtTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const diff = now - d;
  if (diff < 86400000 && d.getDate() === now.getDate()) {
    return `今天 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  const y = d.getFullYear();
  const m = pad(d.getMonth() + 1);
  const day = pad(d.getDate());
  const h = pad(d.getHours());
  const min = pad(d.getMinutes());
  if (y === now.getFullYear()) {
    return `${m}-${day} ${h}:${min}`;
  }
  return `${y}-${m}-${day} ${h}:${min}`;
}

function initIcon(title) {
  if (!title) return 'K';
  const ch = title.trim().charAt(0);
  if (/[\u4e00-\u9fff]/.test(ch)) return ch;
  return ch.toUpperCase();
}

function renderSessionList(sessions) {
  if (sessions.length === 0) {
    $list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">暂无会话</div>';
    $count.textContent = '0 个会话';
    return;
  }
  $count.textContent = sessions.length + ' 个会话';
  $list.innerHTML = sessions.map(s => {
    const active = currentSession && currentSession.id === s.id ? ' active' : '';
    const sub = s.parent_id ? ' sub-session' : '';
    return `<div class="session-item${active}${sub}" data-id="${s.id}" data-parent="${s.parent_id || ''}" onclick="selectSession('${s.id}')">
      <div class="session-item-icon">${initIcon(s.title)}</div>
      <div class="session-item-content">
        <div class="session-item-title">${escHtml(s.title || '未命名会话')}</div>
        <div class="session-item-meta">
          <span>${escHtml(s.directory || '')}</span>
        </div>
      </div>
      <div class="session-item-time">${fmtTime(s.updated)}</div>
    </div>`;
  }).join('');
}

function filterSessions() {
  const q = $search.value.toLowerCase().trim();
  if (!q) { renderSessionList(allSessions); return; }
  const filtered = allSessions.filter(s =>
    (s.title || '').toLowerCase().includes(q) ||
    (s.directory || '').toLowerCase().includes(q)
  );
  renderSessionList(filtered);
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function copyText(btn, text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  } catch {
    btn.textContent = '失败';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  }
}

function simpleMd(text) {
  if (typeof marked !== 'undefined') {
    marked.setOptions({ breaks: true, gfm: true });
    marked.use({
      renderer: {
        html(token) {
          return escHtml(token.text);
        }
      }
    });
    return marked.parse(text);
  }
  return escHtml(text).replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
}

function enhanceCodeBlocks(container) {
  const pres = container.querySelectorAll('.text-part pre, .reasoning-body pre');
  for (const pre of pres) {
    if (pre.parentElement.classList.contains('code-block-wrapper')) continue;
    const code = pre.querySelector('code');
    const text = code ? code.textContent : pre.textContent;
    let lang = '';
    if (code && code.className) {
      const m = code.className.match(/language-(\w+)/);
      if (m) lang = m[1];
    }
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block-wrapper';
    const header = document.createElement('div');
    header.className = 'code-block-header';
    header.innerHTML = '<span class="lang-label">' + escHtml(lang || 'code') + '</span>';
    const btn = document.createElement('span');
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    btn.onclick = function(e) { e.stopPropagation(); copyText(btn, text); };
    header.appendChild(btn);
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);
    pre.style.margin = '0';
    pre.style.border = 'none';
    pre.style.borderRadius = '0';
    if (window.hljs) {
      const codeEl = pre.querySelector('code');
      if (codeEl) hljs.highlightElement(codeEl);
    }
  }
}

function toolIcon(type) {
  if (type === 'bash') return '&gt;_';
  if (type === 'write' || type === 'edit' || type === 'apply_patch') return '✎';
  if (type === 'read' || type === 'list') return '📖';
  if (type === 'glob' || type === 'grep') return '🔍';
  if (type === 'question') return '?';
  if (type === 'task') return '⚡';
  if (type === 'skill') return '🔧';
  return '◆';
}

function toolCss(type) {
  if (type === 'bash') return 'bash';
  if (type === 'write' || type === 'edit') return 'write';
  if (type === 'read' || type === 'glob' || type === 'grep') return 'read';
  if (type === 'question') return 'other';
  if (type === 'task') return 'other';
  if (type === 'skill') return 'bash';
  return 'other';
}

function toolTitle(part) {
  const t = part.tool || '';
  if (t === 'question') {
    const n = (part.questions || []).length;
    return n === 1 ? '问题 1 已回答' : '问题 ' + n + ' 已回答';
  }
  if (t === 'write' || t === 'edit') {
    const label = t === 'write' ? '写入 ' : '编辑 ';
    return label + (part.filePath || '');
  }
  if (t === 'bash') return '执行命令';
  if (t === 'read') return '读取 ' + (part.filePath || '');
  if (t === 'glob') return '搜索文件';
  if (t === 'grep') return '搜索内容';
  if (t === 'list') return '列出目录';
  if (t === 'task') return '子任务';
  if (t === 'todowrite' || t === 'todoread') return '待办事项';
  return t || '工具调用';
}

function toolTitleHtml(part) {
  let diff = '';
  if (part.additions != null) {
    diff += ' <span style="color:var(--green)">+' + part.additions + '</span>';
  }
  if (part.deletions != null) {
    diff += ' <span style="color:var(--red)">-' + part.deletions + '</span>';
  }
  return diff;
}

function toolSub(part) {
  if (part.description) return part.description;
  if (part.command) return part.command;
  if (part.tool === 'read') {
    const parts = [];
    if (part.offset != null) parts.push('offset=' + part.offset);
    if (part.limit != null) parts.push('limit=' + part.limit);
    return parts.join(' ');
  }
  if (part.tool === 'glob') {
    const parts = [];
    if (part.path) parts.push('搜索路径 ' + part.path);
    else if (part.filePath) parts.push('搜索路径 ' + part.filePath);
    if (part.pattern) parts.push('pattern=' + part.pattern);
    return parts.join(' ');
  }
  if (part.tool === 'grep') {
    const parts = [];
    if (part.path) parts.push('搜索路径 ' + part.path);
    else if (part.filePath) parts.push('搜索路径 ' + part.filePath);
    if (part.pattern) parts.push('搜索内容 ' + part.pattern);
    if (part.include) parts.push('include=' + part.include);
    return parts.join(' ');
  }
  if (part.tool === 'task') {
    const parts = [];
    if (part.subagentType) parts.push('类型: ' + part.subagentType);
    if (part.taskId) parts.push('ID: ' + part.taskId);
    return parts.join(' · ');
  }
  if (part.filePath) return part.filePath;
  return '';
}

function toolBody(part) {
    let html = '';
    if (part.tool === 'question') {
        html += '<div class="question-body">';
        const qs = part.questions || [];
        const as = part.answers || [];
        for (let i = 0; i < qs.length; i++) {
            const q = qs[i];
            const ans = as[i] || [];
            html += '<div class="question-item">';
            html += '<div class="q">' + escHtml(q.question || q.header || '') + '</div>';
            if (ans.length > 0) {
                html += '<div class="a"><strong>' + escHtml(ans.join(', ')) + '</strong></div>';
            }
            html += '</div>';
        }
        html += '</div>';
    }
    if (part.tool === 'task' && part.taskId) {
        html += `<div class="task-link" onclick="event.stopPropagation();selectSession('${escAttr(part.taskId)}')">
            <span class="task-link-icon">↗</span>
            <span class="task-link-text">
                <div class="task-link-label">查看子会话</div>
                <div class="task-link-id">${escHtml(part.taskId)}</div>
            </span>
        </div>`;
    }
    if (part.toolInput && !part.command) {
        html += `<div class="bash-section">
            <div class="bash-section-label">输入<span class="copy-btn" data-copy="${escAttr(part.toolInput)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
            <div class="bash-out-block">${escHtml(part.toolInput)}</div>
        </div>`;
    }
    if (part.command) {
        html += `<div class="bash-section">
            <div class="bash-section-label">命令<span class="copy-btn" data-copy="${escAttr(part.command)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
            <div class="bash-cmd-block">${escHtml(part.command)}</div>`;
        if (part.output != null) {
            html += `<div class="bash-separator"></div>
                <div class="bash-section-label">输出<span class="copy-btn" data-copy="${escAttr(part.output)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
                <div class="bash-out-block">${escHtml(part.output) || '(无输出)'}</div>`;
        }
        html += `</div>`;
    } else if (part.output) {
        if (part.tool === 'read' && part.output && part.output.includes('<path>')) {
            if (part.output.includes('<content>')) {
                html += renderReadOutput(part.output);
            } else if (part.output.includes('<entries>')) {
                html += renderReadDirectoryOutput(part.output);
            } else {
                html += `<div class="bash-section">
                <div class="bash-section-label">输出<span class="copy-btn" data-copy="${escAttr(part.output)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
                <div class="bash-out-block">${escHtml(part.output)}</div>
            </div>`;
            }
        } else {
            html += `<div class="bash-section">
                <div class="bash-section-label">输出<span class="copy-btn" data-copy="${escAttr(part.output)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span></div>
                <div class="bash-out-block">${escHtml(part.output)}</div>
            </div>`;
        }
    }
    if (part.diff) {
        html += `<div class="diff-view">${renderDiff(part.diff)}</div>`;
    } else if (part.content) {
        html += `<div class="content-block-wrapper">
            <div class="content-block-header">
                <span class="content-label">内容</span>
                <span class="copy-btn" data-copy="${escAttr(part.content)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制</span>
            </div>
            <div class="content-block">`;
        const lines = part.content.split('\n');
        for (const l of lines) {
            html += `<div class="line"><span>${escHtml(l)}</span></div>`;
        }
        html += `</div></div>`;
    }
    // 显示错误/中止信息
    if (part.status === 'error' || part.error || part.reason) {
        let errorMsg = 'Tool execution aborted';
        if (part.error) errorMsg = part.error;
        if (part.reason) errorMsg = part.reason;
        html += `<div class="tool-error">${escHtml(errorMsg)}</div>`;
    }
    if (!part.command && !part.output && !part.content && !part.diff && !part.toolInput && part.tool !== 'question' && !part.error && !part.reason) {
        html += `<div style="padding:8px 12px;color:var(--text-muted)">(无详细内容)</div>`;
    }
    return html;
}

// 渲染 read 工具的输出
function renderReadOutput(output) {
    let html = '';
    const lines = output.split('\n');
    let inContent = false;
    let filePath = '';
    let fileType = '';
    let contentLines = [];
    let endLine = null;
    
    // 先解析内容
    for (const line of lines) {
        if (line.startsWith('<path>') && line.endsWith('</path>')) {
            filePath = line.slice(6, -7);
        } else if (line.startsWith('<type>') && line.endsWith('</type>')) {
            fileType = line.slice(6, -7);
        } else if (line === '<content>') {
            inContent = true;
        } else if (line.startsWith('(End of file')) {
            endLine = line;
            inContent = false;
        } else if (inContent) {
            contentLines.push(line);
        }
    }
    
    // 构建纯内容用于复制（不带行号）
    let pureContent = '';
    for (const line of contentLines) {
        const match = line.match(/^(\d+):\s?(.*)$/);
        if (match) {
            pureContent += match[2] + '\n';
        } else {
            pureContent += line + '\n';
        }
    }
    pureContent = pureContent.trim();
    
    // 构建HTML
    html += `<div class="read-output-view">`;
    html += `<div class="read-output-header">`;
    if (filePath) {
        html += `<span class="read-path">${escHtml(filePath)}</span>`;
    }
    if (fileType) {
        html += `<span class="read-type">${escHtml(fileType)}</span>`;
    }
    html += `<span class="copy-btn" data-copy="${escAttr(pureContent)}" onclick="event.stopPropagation();copyText(this, this.getAttribute('data-copy'))">复制纯内容</span>`;
    html += `</div>`;
    html += `<div class="read-output-content">`;
    
    for (const line of contentLines) {
        const match = line.match(/^(\d+):\s?(.*)$/);
        if (match) {
            const lineNum = match[1];
            const lineContent = match[2];
            html += `<div class="read-line">
                <span class="read-line-num">${lineNum}</span>
                <span class="read-line-text">${escHtml(lineContent)}</span>
            </div>`;
        } else {
            html += `<div class="read-line">
                <span class="read-line-num"></span>
                <span class="read-line-text">${escHtml(line)}</span>
            </div>`;
        }
    }
    
    if (endLine) {
        html += `<div class="read-end-line">${escHtml(endLine)}</div>`;
    }
    
    html += `</div></div>`;
    return html;
}

function renderReadDirectoryOutput(output) {
    let html = '';
    const lines = output.split('\n');
    let filePath = '';
    let fileType = '';
    let entries = [];
    let inEntries = false;
    let entryCount = 0;

    for (const line of lines) {
        if (line.startsWith('<path>') && line.endsWith('</path>')) {
            filePath = line.slice(6, -7);
        } else if (line.startsWith('<type>') && line.endsWith('</type>')) {
            fileType = line.slice(6, -7);
        } else if (line === '<entries>') {
            inEntries = true;
        } else if (line === '</entries>') {
            inEntries = false;
        } else if (line.startsWith('(') && line.endsWith(' entries)')) {
            const m = line.match(/\((\d+) entries\)/);
            if (m) entryCount = parseInt(m[1]);
        } else if (inEntries) {
            const trimmed = line.trim();
            if (trimmed) {
                const isDir = trimmed.endsWith('/');
                const name = isDir ? trimmed.slice(0, -1) : trimmed;
                entries.push({ name, isDir });
            }
        }
    }

    html += `<div class="read-output-view">`;
    html += `<div class="read-output-header">`;
    if (filePath) {
        html += `<span class="read-path">${escHtml(filePath)}</span>`;
    }
    if (fileType) {
        html += `<span class="read-type">${escHtml(fileType)}</span>`;
    }
    if (entryCount > 0) {
        html += `<span class="read-entry-count">${entryCount} 个条目</span>`;
    }
    html += `</div>`;
    html += `<div class="read-output-content">`;

    for (const entry of entries) {
        const icon = entry.isDir ? '📁' : '📄';
        html += `<div class="read-dir-entry">
            <span class="read-dir-icon">${icon}</span>
            <span class="read-dir-name">${escHtml(entry.name)}</span>
            ${entry.isDir ? '<span class="read-dir-slash">/</span>' : ''}
        </div>`;
    }

    html += `</div></div>`;
    return html;
}

function renderDiff(diff) {
  if (!diff) return '';
  let html = `<div class="diff-header">
    <span>Diff 预览</span>
    <button class="copy-btn" data-copy="${escAttr(diff)}" onclick="event.stopPropagation();copyDiff(this, this.getAttribute('data-copy'))">复制纯内容</button>
  </div>`;
  const lines = diff.split('\n');
  let oldNum = 0;
  let newNum = 0;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith('@@')) {
      const m = l.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (m) { oldNum = parseInt(m[1]) - 1; newNum = parseInt(m[2]) - 1; }
      html += `<div class="diff-hunk">${escHtml(l)}</div>`;
    } else if (l.startsWith('+') && !l.startsWith('+++')) {
      newNum++;
      html += `<div class="diff-line diff-add">
        <span class="diff-num">${newNum}</span>
        <span class="diff-sign">+</span>
        <span class="diff-text">${escHtml(l.substring(1))}</span>
      </div>`;
    } else if (l.startsWith('-') && !l.startsWith('---')) {
      oldNum++;
      html += `<div class="diff-line diff-del">
        <span class="diff-num">${oldNum}</span>
        <span class="diff-sign">-</span>
        <span class="diff-text">${escHtml(l.substring(1))}</span>
      </div>`;
    } else if (l.startsWith('---') || l.startsWith('+++') || l.startsWith('Index:') || l.startsWith('===')) {
      continue;
    } else {
      oldNum++; newNum++;
      html += `<div class="diff-line">
        <span class="diff-num">${newNum}</span>
        <span class="diff-sign"> </span>
        <span class="diff-text">${escHtml(l)}</span>
      </div>`;
    }
  }
  return html;
}

function copyDiff(btn, diff) {
  let content = '';
  const lines = diff.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith('@@') || 
        l.startsWith('---') || 
        l.startsWith('+++') || 
        l.startsWith('Index:') || 
        l.startsWith('===')) {
      continue;
    }
    if (l.startsWith('+')) {
      content += l.substring(1) + '\n';
    } else if (!l.startsWith('-')) {
      content += l + '\n';
    }
  }
  copyText(btn, content.trim());
}

function formatTokens(tokens) {
  if (!tokens) return '';
  const t = tokens;
  const parts = [];
  if (t.input) parts.push('输入 ' + t.input);
  if (t.output) parts.push('输出 ' + t.output);
  return parts.join(' · ');
}

function renderParts(parts) {
  if (!parts || parts.length === 0) return { html: '', tokensInfo: '' };
  let html = '<div class="assistant-parts">';
  let tokensInfo = '';
  for (const p of parts) {
    switch (p.type) {
      case 'reasoning':
        html += `<div class="reasoning-part">
          <div class="reasoning-header" onclick="togglePart(this.parentElement)">
            <span class="icon">🧠</span>
            <span class="label">推理</span>
            <span class="summary">${escHtml((p.text || '').substring(0, 80))}</span>
          </div>
          <div class="reasoning-body">${simpleMd(p.text || '')}</div>
        </div>`;
        break;
      case 'text':
        html += `<div class="text-part">${simpleMd(p.text || '')}</div>`;
        break;
      case 'tool':
        if (p.tool === 'todowrite') {
          html += `<div class="todo-part open">
            <div class="todo-header" onclick="togglePart(this.parentElement)">
              <span class="t-icon">✓</span>
              <span class="t-summary">
                <div class="t-title">待办事项</div>
                ${renderTodoSub(p) ? '<div class="t-sub">' + escHtml(renderTodoSub(p)) + '</div>' : ''}
              </span>
              <span class="t-expand">▶</span>
            </div>
            ${renderTodoBody(p)}
          </div>`;
        } else {
          const isError = p.status === 'error' || p.error || p.reason;
          const isModify = p.tool === 'write' || p.tool === 'edit';
          html += `<div class="tool-part${isError ? ' error' : ''}${isModify ? ' modify' : ''}">
            <div class="tool-header" onclick="togglePart(this.parentElement)">
              <span class="t-icon ${toolCss(p.tool)}">${toolIcon(p.tool)}</span>
              <span class="t-summary">
                <div class="t-title">${escHtml(toolTitle(p))}${toolTitleHtml(p)}</div>
                ${toolSub(p) ? '<div class="t-sub">' + escHtml(toolSub(p)) + '</div>' : ''}
              </span>
              <span class="t-expand">▶</span>
            </div>
            <div class="tool-body">${toolBody(p)}</div>
          </div>`;
        }
        break;
      case 'step-start':
        break;
      case 'step-finish':
        if (p.tokens) {
          tokensInfo = formatTokens(p.tokens);
        }
        break;
      case 'compaction':
        html += `<div style="padding:8px;color:var(--text-muted);font-size:12px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);margin:8px 0;">[对话压缩]</div>`;
        break;
    }
  }
  html += '</div>';
  return { html, tokensInfo };
}

function renderTodoBody(part) {
  const todos = part.todos || [];
  if (todos.length === 0) {
    return '<div style="padding:8px 12px;color:var(--text-muted)">(无待办事项)</div>';
  }
  let html = '<div class="todo-body">';
  for (const todo of todos) {
    const completed = todo.status === 'completed';
    html += `<div class="todo-item${completed ? ' completed' : ''}">
      <div class="todo-checkbox">
        <span class="todo-checkmark">✓</span>
      </div>
      <div class="todo-text">${escHtml(todo.content || '')}</div>
    </div>`;
  }
  html += '</div>';
  return html;
}

function renderTodoSub(part) {
  const todos = part.todos || [];
  if (todos.length === 0) return '';
  const completed = todos.filter(t => t.status === 'completed').length;
  return `${completed}/${todos.length} 完成`;
}

function renderMessages(msgs) {
  if (!msgs || msgs.length === 0) {
    return '<div class="empty-state"><p>该会话无消息记录</p></div>'
  }
  let html = ''
  // 先把消息按 parentID 分组，这样可以知道哪些 assistant 消息属于同一个 user 消息
  // 简单起见，先检查每个 assistant 消息有没有 error 是 MessageAbortedError
  for (const m of msgs) {
    if (m.role === 'user') {
      const parts = m.parts || []
      const texts = parts.filter(p => p.type === 'text').map(p => p.text).join('\n')
      html += `<div class="turn">
        <div class="user-msg">
          <div class="user-msg-bubble">${escHtml(texts)}</div>
        </div>
        <div class="user-msg-meta">
          <span>${m.agent || ''}</span>
          <span>${m.model || ''}</span>
          <span>${fmtTime(m.time_created)}</span>
        </div>
      </div>`
    } else if (m.role === 'assistant') {
      // 先渲染 parts
      const { html: partsHtml, tokensInfo } = renderParts(m.parts)
      html += `<div class="turn">
        ${partsHtml}`
      // 检查是否有中断错误
      if (m.error && m.error.name === 'MessageAbortedError') {
        html += `<div class="interrupted-divider">
          <span class="interrupted-icon">⊘</span>
          <span>Tool execution aborted</span>
        </div>`
      }
      // 构建元信息
      let metaParts = []
      if (m.agent) metaParts.push(m.agent)
      if (m.model) metaParts.push(m.model)
      if (tokensInfo) metaParts.push(`Token: ${tokensInfo}`)
      metaParts.push(fmtTime(m.time_created))
      // 过滤掉空值
      metaParts = metaParts.filter(p => p)
      html += `<div class="user-msg-meta" style="justify-content:flex-start">
          <span>${metaParts.join(' · ')}</span>
        </div>
      </div>`
    }
  }
  return html
}

function togglePart(el) {
  el.classList.toggle('open');
}

function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  sidebar.classList.toggle('collapsed');
}

async function loadSessions() {
  try {
    const res = await fetch(API_BASE + '/api/sessions');
    allSessions = await res.json();
    renderSessionList(allSessions);
  } catch (err) {
    $list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--red)">加载失败: ' + escHtml(err.message) + '</div>';
    $count.textContent = '加载失败';
  }
}

async function selectSession(id) {
  currentSession = allSessions.find(s => s.id === id);
  if (!currentSession) return;

  $header.style.display = 'flex';
  $title.textContent = currentSession.title || '未命名会话';
  $dir.textContent = currentSession.directory || '';
  $sid.textContent = currentSession.id || '';

  const $parentContainer = document.getElementById('parent-link-container');
  if (currentSession.parent_id) {
    const parentSession = allSessions.find(s => s.id === currentSession.parent_id);
    const parentTitle = parentSession ? escHtml(parentSession.title || '未命名会话') : currentSession.parent_id;
    $parentContainer.innerHTML = `<div class="parent-link" onclick="selectSession('${escAttr(currentSession.parent_id)}')">
      <span class="parent-link-icon">↩</span>
      <span>返回父会话: ${parentTitle}</span>
    </div>`;
  } else {
    $parentContainer.innerHTML = '';
  }

  $body.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px">加载会话内容...</p></div>';

  renderSessionList(allSessions);

  try {
    const res = await fetch(API_BASE + '/api/sessions/' + encodeURIComponent(id) + '/messages');
    const msgs = await res.json();
    $body.innerHTML = renderMessages(msgs);
    enhanceCodeBlocks($body);
  } catch (err) {
    $body.innerHTML = '<div class="empty-state"><p style="color:var(--red)">加载失败: ' + escHtml(err.message) + '</p></div>';
  }
}

loadSessions();
</script>

</body>
</html>
